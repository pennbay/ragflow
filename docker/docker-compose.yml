include:
  - ./docker-compose-base.yml
# To ensure that the container processes the locally modified `service_conf.yaml.template` instead of the one included in its image, you need to mount the local `service_conf.yaml.template` to the container.
services:
  deepdoc:
    image: ${DEEPDOC_IMAGE:-deepdoc_oss:latest}
    profiles:
      - deepdoc
    build:
      context: ..
      dockerfile: Dockerfile_deepdoc_oss
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9390/health"]
      interval: 10s
      timeout: 10s
      retries: 60

  ragflow-gpu:
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    profiles:
      - gpu
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
      args:
        BASE_IMAGE: ${RAGFLOW_IMAGE}
        NEED_MIRROR: "1"
        RAGFLOW_VERSION: ${RAGFLOW_VERSION:-dev}
    image: ${GPU_LOCAL_IMAGE:-ragflow-gpu-local:dev}
    environment:
      REGISTER_ENABLED: "0"
      DEVICE: "gpu"
      DOC_BULK_SIZE: "4"
      EMBEDDING_BATCH_SIZE: "16"
      OCR_GPU_MEM_LIMIT_MB: "12288"
    command:
      - --enable-adminserver
      - --enable-mcpserver
      - --mcp-host=0.0.0.0
      - --mcp-port=9382
      - --mcp-base-url=http://127.0.0.1:9380
      - --mcp-script-path=/ragflow/mcp/server/server.py
      - --mcp-mode=host
      # Keep streamable-http enabled so MCP clients can use the /mcp endpoint.
      # In host mode, each client request still needs Authorization/api_key headers.
    ports:
      - 127.0.0.1:10080:80
      # - 127.0.0.1:${SVR_HTTP_PORT}:9380
      - 192.168.88.243:${SVR_MCP_PORT}:9382
    volumes:
      - ./ragflow-logs:/ragflow/logs
      # - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
      - ../common:/ragflow/common
      - ../mcp:/ragflow/mcp
    env_file: .env
    networks:
      - ragflow
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]


